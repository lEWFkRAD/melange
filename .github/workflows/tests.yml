name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux xvfb
      - name: Install package with extras
        run: pip install -e ".[test,solver,crypto,gui]"
      - name: Run the full suite
        run: xvfb-run -a env PYTHONPATH=src python3 -m unittest discover -s tests
